spring.application.name=OrderMatchingEngine
spring.data.jdbc.dialect=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/engine
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============ OPTIMIZED FOR HIGH CONCURRENCY ============

# Connection Pool - Increased for load testing
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# Hibernate Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Transaction Settings
# Use READ_COMMITTED (not SERIALIZABLE) for better performance
spring.jpa.properties.hibernate.connection.isolation=2
spring.transaction.default-timeout=30

# Optimistic Locking
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false

# Query Optimization
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Disable second-level cache (can cause issues with high concurrency)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Logging (minimal for performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.orm.jpa=WARN

# Statement caching for performance
spring.jpa.properties.hibernate.jdbc.statement_cache_size=50
spring.jpa.properties.hibernate.jdbc.use_scrollable_resultset=true